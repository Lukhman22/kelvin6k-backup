# Test configuration for J2 (Z-axis, SV670N) only
[EMC]
VERSION = 1.1
MACHINE = Test_J2_Only
DEBUG = 0

[DISPLAY]
DISPLAY = axis
PROGRAM_PREFIX = /home/kelvin6k/linuxcnc/nc_files
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_VELOCITY = 200.0
INCREMENTS = 1mm 5mm 10mm .1mm
MAX_FEED_OVERRIDE = 2.0
EDITOR = gedit
GEOMETRY = Z
CYCLE_TIME = 100
OPEN_FILE = /home/kelvin6k/linuxcnc/nc_files/blank.ngc

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap,.gcode (G-code files)
ngc = ./gcode_validator.py
nc = ./gcode_validator.py
tap = ./gcode_validator.py
gcode = ./gcode_validator.py

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALUI = halui
HALFILE = test_j2.hal

[HALUI]

[TRAJ]
COORDINATES = Z
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
MAX_LINEAR_VELOCITY = 50.0
MAX_LINEAR_ACCELERATION = 200.0
NO_FORCE_HOMING = 1

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = trivkins coordinates=Z
JOINTS = 1

# Z AXIS - Height (mm)
[AXIS_Z]
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 200.0
MIN_LIMIT = -10.0
MAX_LIMIT = 2010.0

# Joint 0 - Z Height (Physically Joint 2 / Slave 2)
# Using parameters from original [JOINT_2]
[JOINT_0]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -10.0
MAX_LIMIT = 2010.0
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 200.0
SCALE = 1666.666
FERROR = 1000.0
MIN_FERROR = 200.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 0
HOME_USE_INDEX = NO
HOME_SEQUENCE = 0

# QtDragon_hd — SIMULATION variant.
# Boots without EtherCAT/lcec/cia402, intended for UI customization
# on a dev box. Joint feedback is looped from command (no real motion).

[EMC]
VERSION = 1.1
MACHINE = Polar_2D_CNC_QtDragon_Sim
DEBUG = 0

[DISPLAY]
DISPLAY = qtvcp qtdragon_hd
QSS_STYLESHEET = /usr/share/qtvcp/screens/qtdragon_hd/dark_grey.qss
PREFERENCE_FILE_PATH = WORKINGFOLDER/qtdragon_hd_sim.pref
MACHINE_LOG_PATH = machine_log.txt
LOG_FILE = qtdragon_sim.log
PROGRAM_PREFIX = ~/linuxcnc/nc_files
EDITOR = gedit
GEOMETRY = XYZ
CYCLE_TIME = 100
INTRO_TIME = 2
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_VELOCITY = 200.0
MIN_LINEAR_VELOCITY = 0.5
DEFAULT_ANGULAR_VELOCITY = 36.0
MAX_ANGULAR_VELOCITY = 180.0
MIN_ANGULAR_VELOCITY = 1.0
DEFAULT_SPINDLE_0_SPEED = 1000
MAX_SPINDLE_0_SPEED = 24000
MIN_SPINDLE_0_SPEED = 0
INCREMENTS = .1mm 1mm 5mm 10mm
ANGULAR_INCREMENTS = .1° 1° 5° 10°
MAX_FEED_OVERRIDE = 2.0

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap,.gcode (G-code files)

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALUI = halui
HALFILE = cylindrical_robot_sim.hal
POSTGUI_HALFILE = postgui_sim.hal

[HALUI]

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
MAX_LINEAR_VELOCITY = 200.0
MAX_LINEAR_ACCELERATION = 1000.0
MAX_ANGULAR_VELOCITY = 180.0
MAX_ANGULAR_ACCELERATION = 500.0
NO_FORCE_HOMING = 1
POSITION_FILE = position_sim.txt

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
# Sim uses trivkins (identity). Real machine uses polarkins3d in
# cylindrical_robot.ini; sim doesn't because it would also need
# the .so loaded from this folder.
KINEMATICS = trivkins coordinates=XYZ
JOINTS = 3

[PROBE]
USE_PROBE = none

[MDI_COMMAND_LIST]
# "Z to Zero" (G0 Z0) removed — operator-requested.

[AXIS_X]
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 500.0
# Sim uses trivkins (identity), so axis limits must equal joint limits.
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0

[JOINT_0]
TYPE = ANGULAR
HOME = 0.0
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 50.0
# Sim: home in place, instant.
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 0
HOME_USE_INDEX = NO
HOME_SEQUENCE = 1
HOME_OFFSET = 0.0

[AXIS_Y]
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 750.0
MIN_LIMIT = 650.0
MAX_LIMIT = 2500.0

[JOINT_1]
TYPE = LINEAR
HOME = 650.0
MIN_LIMIT = 650.0
MAX_LIMIT = 2500.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 0
HOME_USE_INDEX = NO
HOME_SEQUENCE = 0
HOME_OFFSET = 650.0

[AXIS_Z]
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 200.0
MIN_LIMIT = 0.0
MAX_LIMIT = 2000.0

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = 0.0
MAX_LIMIT = 2000.0
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 200.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 0
HOME_USE_INDEX = NO
HOME_SEQUENCE = 2
HOME_OFFSET = 0.0


# 2D Polar/Cylindrical Robot Configuration
# This is a polar coordinate CNC machine:
# - A axis: Rotary base (angle in degrees)
# - Y axis: Radial arm (distance from center in mm)
# Work volume: circular 2D area

[EMC]
VERSION = 1.1
MACHINE = Polar_2D_CNC
DEBUG = 0

[DISPLAY]
DISPLAY = axis
PROGRAM_PREFIX = /home/kelvin6k/linuxcnc/nc_files
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_VELOCITY = 200.0
DEFAULT_ANGULAR_VELOCITY = 36.0
MAX_ANGULAR_VELOCITY = 180.0
INCREMENTS = 1mm 5mm 10mm .1mm 1deg 5deg 10deg .1deg
MAX_FEED_OVERRIDE = 2.0
EDITOR = gedit
GEOMETRY = XYZ
CYCLE_TIME = 100
PYVCP = custompanel.xml
# GLADEVCP = -u dashboard_handler.py dashboard.glade
OPEN_FILE = /home/kelvin6k/linuxcnc/nc_files/blank.ngc

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap,.gcode (G-code files)
ngc = ./gcode_validator.py
nc = ./gcode_validator.py
tap = ./gcode_validator.py
gcode = ./gcode_validator.py

[RS274NGC]
PARAMETER_FILE = linuxcnc.var

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALUI = halui
HALFILE = cylindrical_robot.hal
POSTGUI_HALFILE = postgui.hal

[HALUI]

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
MAX_LINEAR_VELOCITY = 200.0
MAX_LINEAR_ACCELERATION = 1000.0
MAX_ANGULAR_VELOCITY = 180.0
MAX_ANGULAR_ACCELERATION = 500.0
NO_FORCE_HOMING = 1

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = polarkins3d
JOINTS = 3

# X AXIS - Cartesian X coordinate (mm)
# polarkins converts to angle internally
[AXIS_X]
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -2500.0
MAX_LIMIT = 2500.0

# Joint 0 - Angle (degrees) - controlled by polarkins
# Absolute encoder mode: retains position across power cycles
# Homing: Home in place (HOME_SEARCH_VEL=0), then use G92 to set zero if needed
[JOINT_0]
TYPE = ANGULAR
HOME = 0.0
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 50.0
SCALE = 100.0
FERROR = 1000.0
MIN_FERROR = 200.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 0
HOME_USE_INDEX = NO
HOME_SEQUENCE = 1

# Y AXIS - Cartesian Y coordinate (mm)
# polarkins converts to radius internally
[AXIS_Y]
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 750.0
MIN_LIMIT = -2500.0
MAX_LIMIT = 2500.0

# Joint 1 - Radius (mm) - controlled by polarkins
# Absolute encoder homing: HOME / HOME_OFFSET are auto-patched at launch by
# start_linuxcnc.sh using j1_calibration.json + current SV660 encoder count.
# Click "Home J1" once after launch to snap joint to encoder-derived position.
[JOINT_1]
TYPE = LINEAR
HOME = 650.0
MIN_LIMIT = 650.0
MAX_LIMIT = 2500.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0
SCALE = 100.0
FERROR = 100.0
MIN_FERROR = 50.0
HOME_OFFSET = 650.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 5.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 0

# Z AXIS - Height (mm)
# Vertical axis for 3D printing, optional homing
[AXIS_Z]
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 200.0
MIN_LIMIT = -50.0
MAX_LIMIT = 2000.0

# Joint 2 - Z Height (mm)
# SCALE: 1666.666 pulses per mm
# Homing: Optional (HOME_SEARCH_VEL=0 → home in place)
# Jog to desired position, Home, then use G92 Z0 to set zero
[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -50.0
MAX_LIMIT = 2000.0
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 200.0
SCALE = 1666.666
FERROR = 1000.0
MIN_FERROR = 200.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 0
HOME_USE_INDEX = NO
HOME_SEQUENCE = 2

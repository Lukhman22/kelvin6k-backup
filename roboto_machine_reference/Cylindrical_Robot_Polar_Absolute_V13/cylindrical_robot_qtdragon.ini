# 2D/3D Polar Cylindrical Robot — QtDragon_hd variant
# Parallel to cylindrical_robot.ini (which uses AXIS + PyVCP).
# This config drops the custom PyVCP panels; calibrate-J0, search-home-J1,
# encoder readouts, manual override checkboxes, aux-motor sliders are NOT
# available here. Use cylindrical_robot.ini for those workflows.

[EMC]
VERSION = 1.1
MACHINE = Polar_2D_CNC_QtDragon
DEBUG = 0

[DISPLAY]
DISPLAY = qtvcp qtdragon_hd
QSS_STYLESHEET = /usr/share/qtvcp/screens/qtdragon_hd/dark_grey.qss
PREFERENCE_FILE_PATH = WORKINGFOLDER/qtdragon_hd.pref
MACHINE_LOG_PATH = machine_log.txt
LOG_FILE = qtdragon.log
PROGRAM_PREFIX = /home/kelvin6k/linuxcnc/nc_files
OPEN_FILE = /home/kelvin6k/linuxcnc/nc_files/blank.ngc
EDITOR = gedit
GEOMETRY = XYZ
CYCLE_TIME = 100
INTRO_TIME = 2
DEFAULT_LINEAR_VELOCITY = 50.0
MAX_LINEAR_VELOCITY = 200.0
MIN_LINEAR_VELOCITY = 0.5
DEFAULT_ANGULAR_VELOCITY = 36.0
MAX_ANGULAR_VELOCITY = 180.0
MIN_ANGULAR_VELOCITY = 1.0
DEFAULT_SPINDLE_0_SPEED = 0
MAX_SPINDLE_0_SPEED = 0
MIN_SPINDLE_0_SPEED = 0
INCREMENTS = .1mm 1mm 5mm 10mm
ANGULAR_INCREMENTS = .1° 1° 5° 10°
MAX_FEED_OVERRIDE = 2.0

[FILTER]
PROGRAM_EXTENSION = .ngc,.nc,.tap,.gcode (G-code files)
ngc = ./gcode_validator.py
nc = ./gcode_validator.py
tap = ./gcode_validator.py
gcode = ./gcode_validator.py

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
# QtDragon ships subroutines used by its built-in probe / tool-sensor tabs.
# Add your nc_files dir if you want those to find local subs.
SUBROUTINE_PATH = /home/kelvin6k/linuxcnc/nc_files

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[HAL]
HALUI = halui
HALFILE = cylindrical_robot.hal
POSTGUI_HALFILE = postgui_qtdragon.hal

[HALUI]

[TRAJ]
COORDINATES = X Y Z
LINEAR_UNITS = mm
ANGULAR_UNITS = deg
MAX_LINEAR_VELOCITY = 200.0
MAX_LINEAR_ACCELERATION = 1000.0
MAX_ANGULAR_VELOCITY = 180.0
MAX_ANGULAR_ACCELERATION = 500.0
NO_FORCE_HOMING = 1
POSITION_FILE = position.txt

[EMCIO]
EMCIO = io
CYCLE_TIME = 0.100
TOOL_TABLE = tool.tbl

[KINS]
KINEMATICS = polarkins3d
JOINTS = 3

# QtDragon surfaces these tabs if the section is present. Empty/no-op
# stubs keep the GUI from logging missing-section warnings; populate later.
[PROBE]
USE_PROBE = none

[MDI_COMMAND_LIST]
# Format: MDI_COMMAND = <gcode>,<button label>
# "Z to Zero" (G0 Z0) removed — operator-requested.
# M64 P4 / M65 P4 "Aux Master" macros removed — aux motors are now driven
# directly by the panel checkbox (see postgui_qtdragon.hal aux block).
# motion.digital-out-04 is no longer netted into the aux chain.

# ---------------------------------------------------------------
# AXES & JOINTS — identical to cylindrical_robot.ini
# (kept in sync so HAL pin mapping doesn't change between configs)
# ---------------------------------------------------------------

[AXIS_X]
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 500.0
MIN_LIMIT = -2500.0
MAX_LIMIT = 2500.0

[JOINT_0]
TYPE = ANGULAR
HOME = 0.0
MIN_LIMIT = -360.0
MAX_LIMIT = 360.0
MAX_VELOCITY = 30.0
MAX_ACCELERATION = 50.0
SCALE = 100.0
FERROR = 1000.0
MIN_FERROR = 200.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 0
HOME_USE_INDEX = NO
HOME_SEQUENCE = 1

[AXIS_Y]
MAX_VELOCITY = 200.0
MAX_ACCELERATION = 750.0
MIN_LIMIT = -2500.0
MAX_LIMIT = 2500.0

[JOINT_1]
TYPE = LINEAR
HOME = 650.0
MIN_LIMIT = 650.0
MAX_LIMIT = 2500.0
MAX_VELOCITY = 100.0
MAX_ACCELERATION = 500.0
SCALE = 100.0
FERROR = 100.0
MIN_FERROR = 50.0
HOME_OFFSET = 650.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 5.0
HOME_USE_INDEX = NO
HOME_IGNORE_LIMITS = YES
HOME_SEQUENCE = 0

[AXIS_Z]
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 200.0
MIN_LIMIT = -50.0
MAX_LIMIT = 2000.0

[JOINT_2]
TYPE = LINEAR
HOME = 0.0
MIN_LIMIT = -50.0
MAX_LIMIT = 2000.0
MAX_VELOCITY = 50.0
MAX_ACCELERATION = 200.0
SCALE = 1666.666
FERROR = 1000.0
MIN_FERROR = 200.0
HOME_OFFSET = 0.0
HOME_SEARCH_VEL = 0
HOME_LATCH_VEL = 0
HOME_FINAL_VEL = 0
HOME_USE_INDEX = NO
HOME_SEQUENCE = 2
